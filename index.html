<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HypeComm — Practice your communication skills with AI audience feedback. Get scored on pace, filler words, and fluency." />
  <meta name="theme-color" content="#0f0f1a" />
  <title>HypeComm | Communication Skills Practice</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#topicGrid">Skip to topics</a>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <div class="app-shell">

    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="logo">HypeComm</h1>
        <p class="tagline">Practice speaking. Get feedback. Improve.</p>
      </div>
      <div class="header-right">
        <button id="soundToggle" class="btn-icon" type="button" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <!-- ── Setup Phase ─────────────────────────────────────── -->
    <div id="setupPhase">

      <!-- Progress Dashboard -->
      <section class="progress-dashboard" id="progressPanel" aria-label="Your progress">
        <div class="progress-stat">
          <span class="progress-num" id="totalSessions">0</span>
          <span class="progress-label">Sessions</span>
        </div>
        <div class="progress-stat">
          <span class="progress-num" id="currentStreak">0 days</span>
          <span class="progress-label">Streak</span>
        </div>
        <div class="progress-stat">
          <span class="progress-num" id="bestScore">—</span>
          <span class="progress-label">Best Score</span>
        </div>
        <div class="progress-stat progress-chart">
          <div class="recent-scores" id="recentScores" aria-label="Recent scores">
            <span class="no-data">No sessions yet</span>
          </div>
          <span class="progress-label">Last 10 Sessions</span>
        </div>
      </section>

      <!-- Topic Categories -->
      <section aria-label="Choose a topic category">
        <h2 class="section-title">Choose a Topic</h2>
        <div class="topic-grid" id="topicGrid" role="listbox" aria-label="Topic categories"></div>
      </section>

      <!-- Practice Modes -->
      <section aria-label="Choose practice mode">
        <h2 class="section-title">Choose a Mode</h2>
        <div class="mode-grid" id="modeGrid" role="listbox" aria-label="Practice modes"></div>
      </section>

      <!-- Topic Display -->
      <section class="topic-display" id="topicDisplay" hidden aria-label="Your speaking topic">
        <p class="topic-category-label" id="topicCategory"></p>
        <p class="topic-text" id="topicText"></p>
        <button id="newTopicBtn" class="btn-secondary" type="button">
          Shuffle Topic <kbd class="kbd-hint">N</kbd>
        </button>
      </section>

      <!-- Start Button -->
      <div class="start-area">
        <button id="startBtn" class="btn-primary btn-large" disabled>
          Start Practice
        </button>
      </div>
    </div>

    <!-- ── Practice Phase ──────────────────────────────────── -->
    <div id="practicePhase" hidden>
      <div class="practice-layout">

        <!-- Left: Video + Topic -->
        <div class="practice-left">
          <!-- Current Topic Banner -->
          <div class="practice-topic-banner">
            <p class="practice-topic-label" id="topicCategoryPractice"></p>
            <p class="practice-topic-text" id="topicTextPractice"></p>
          </div>

          <!-- Timer -->
          <div class="timer-area">
            <div class="timer-display" id="timerDisplay" role="timer" aria-live="polite">00:00</div>
            <div class="timer-bar" id="timerBar">
              <div class="timer-bar-fill" id="timerBarFill"></div>
            </div>
          </div>

          <!-- Video -->
          <div class="video-wrapper">
            <video id="preview" playsinline autoplay muted aria-label="Camera preview"></video>
            <canvas class="visualizer-canvas" id="visualizerCanvas" aria-hidden="true"></canvas>
          </div>

          <!-- Engagement Meter -->
          <div class="engagement-meter" role="meter" aria-label="Audience engagement" aria-valuemin="0" aria-valuemax="100">
            <div class="engagement-header">
              <span class="engagement-title">Audience Engagement</span>
              <span class="engagement-label" id="engagementLabel">Waiting 0%</span>
            </div>
            <div class="engagement-track">
              <div class="engagement-fill" id="engagementFill"></div>
            </div>
          </div>

          <div class="practice-controls">
            <span class="speech-status" id="speechStatus">Initializing...</span>
            <span class="status-label" id="statusLabel"></span>
            <button id="stopBtn" class="btn-danger" disabled>End Practice</button>
          </div>
        </div>

        <!-- Right: Audience Comments -->
        <div class="practice-right">
          <div class="audience-header">
            <div>
              <p class="audience-eyebrow">AI Audience</p>
              <h2 class="audience-title">Live Reactions</h2>
            </div>
            <div class="comment-count-badge">
              <span id="commentCount">0</span> comments
            </div>
          </div>
          <div class="comment-stream" id="commentStream" role="log" aria-live="polite" aria-label="Audience comments" tabindex="0"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Feedback Modal ──────────────────────────────────── -->
  <div class="feedback-modal" id="feedbackModal" hidden role="dialog" aria-label="Practice feedback" aria-modal="true">
    <div class="feedback-card">
      <h3 class="feedback-title">Practice Complete</h3>
      <div id="feedbackContent"></div>
      <div class="feedback-actions">
        <button class="btn-primary" id="feedbackPracticeAgain" type="button">Practice Again</button>
        <button class="btn-secondary" id="feedbackClose" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Comment Template ────────────────────────────────── -->
  <template id="commentTemplate">
    <article class="comment">
      <div class="avatar" aria-hidden="true"></div>
      <div>
        <div class="meta">
          <span class="username"></span>
          <span class="timestamp"></span>
        </div>
        <p class="body"></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
