<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HypeComm Tests</title>
  <style>
    body { font-family: monospace; background: #0f0f1a; color: #e0e0e0; padding: 24px; }
    h1 { color: #818cf8; margin-bottom: 4px; }
    p.sub { color: #94a3b8; margin-top: 0; }
    pre { white-space: pre-wrap; line-height: 1.6; font-size: 13px; }
  </style>
</head>
<body>
  <h1>HypeComm Test Runner</h1>
  <p class="sub">Communication skills practice tool — unit tests</p>
  <pre id="output">Running tests...</pre>

  <!-- DOM stubs for app.js initialization -->
  <div hidden>
    <div id="topicGrid"></div>
    <div id="modeGrid"></div>
    <div id="topicDisplay" hidden></div>
    <p id="topicText"></p>
    <p id="topicCategory"></p>
    <button id="startBtn" disabled></button>
    <button id="stopBtn" disabled></button>
    <button id="newTopicBtn"></button>
    <div id="timerDisplay"></div>
    <div id="timerBar"><div id="timerBarFill"></div></div>
    <video id="preview"></video>
    <canvas id="visualizerCanvas"></canvas>
    <div id="commentStream"></div>
    <template id="commentTemplate">
      <article class="comment">
        <div class="avatar"></div>
        <div><div class="meta"><span class="username"></span><span class="timestamp"></span></div><p class="body"></p></div>
      </article>
    </template>
    <span id="commentCount"></span>
    <div id="engagementFill"></div>
    <span id="engagementLabel"></span>
    <span id="speechStatus"></span>
    <span id="statusLabel"></span>
    <div id="toastContainer"></div>
    <button id="soundToggle"></button>
    <div id="feedbackModal" hidden></div>
    <div id="feedbackContent"></div>
    <button id="feedbackClose"></button>
    <button id="feedbackPracticeAgain"></button>
    <div id="progressPanel"></div>
    <span id="totalSessions"></span>
    <span id="currentStreak"></span>
    <span id="bestScore"></span>
    <div id="recentScores"></div>
    <div id="setupPhase"></div>
    <div id="practicePhase" hidden></div>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const lines = [];
    const origLog = console.log;
    const origError = console.error;
    console.log = (...args) => { origLog(...args); lines.push(args.join(' ')); outputEl.textContent = lines.join('\n'); };
    console.error = (...args) => { origError(...args); lines.push(args.join(' ')); outputEl.textContent = lines.join('\n'); };
  </script>
  <script src="app.js"></script>
  <script src="app.test.js"></script>
</body>
</html>
