<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HypeCam Tests</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 24px; }
    h1 { color: #7affcf; margin-bottom: 8px; }
    p.sub { color: #8ba0b8; margin-top: 0; }
    pre { white-space: pre-wrap; line-height: 1.6; font-size: 13px; }
  </style>
</head>
<body>
  <h1>HypeCam Test Runner</h1>
  <p class="sub">Framework-free unit &amp; integration tests</p>
  <pre id="output">Running tests...</pre>

  <!-- Minimal DOM stubs so app.js can initialize -->
  <div hidden>
    <button id="startBtn"></button>
    <button id="stopBtn" disabled></button>
    <a id="downloadBtn" disabled></a>
    <video id="preview"></video>
    <div id="liveBadge"></div>
    <span id="statusLabel"></span>
    <span id="latencyLabel"></span>
    <span id="commentCount"></span>
    <div id="commentStream"></div>
    <template id="commentTemplate">
      <article class="comment">
        <div class="avatar"></div>
        <div><div class="meta"><span class="username"></span><span class="timestamp"></span></div><p class="body"></p></div>
      </article>
    </template>
    <div id="speechHint"></div>
    <span id="streamTimer"></span>
    <span id="viewerCount"></span>
    <div id="typingIndicator" hidden></div>
    <div id="emojiBar"></div>
    <canvas id="visualizerCanvas"></canvas>
    <div id="hypeMeter"></div>
    <div id="hypeFill"></div>
    <span id="hypeLabel"></span>
    <div id="filterBar"></div>
    <button id="highlightBtn" disabled></button>
    <div id="highlightsList"></div>
    <input id="chatInput" />
    <button id="chatSendBtn"></button>
    <div id="moodIndicator"></div>
    <span id="moodLabel"></span>
    <span id="moodIcon"></span>
    <button id="pipBtn" disabled></button>
    <button id="fullscreenBtn" disabled></button>
    <button id="screenshotBtn" disabled></button>
    <button id="soundToggle"></button>
    <div id="toastContainer"></div>
    <div id="confettiLayer"></div>
    <div id="recapModal" hidden></div>
    <div id="recapContent"></div>
    <button id="recapClose"></button>
    <canvas id="sparklineCanvas"></canvas>
    <div id="videoOverlay"></div>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const lines = [];
    const origLog = console.log;
    const origError = console.error;
    console.log = (...args) => { origLog(...args); lines.push(args.join(' ')); outputEl.textContent = lines.join('\n'); };
    console.error = (...args) => { origError(...args); lines.push(args.join(' ')); outputEl.textContent = lines.join('\n'); };
  </script>
  <script src="app.js"></script>
  <script src="app.test.js"></script>
</body>
</html>
